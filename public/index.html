<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Classement Motocross</title>
  <style>
    /* Style général de la page */
    body {
  font-family: Arial, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
      overflow-y: auto;
}

  html, body {
  background: transparent;
  margin: 0;
  padding: 0;
}
    
.container {
  width: 350px;
  margin-top: 20px;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.6); /* semi transparent */
  backdrop-filter: blur(4px);
  padding: 10px;
  margin-bottom: 6px;
  border-left: 4px solid #00ff88;
}

.pos {
  color: #00ff88;
  font-weight: bold;
  width: 30px;
}

.num {
  background: #333;
  padding: 5px 8px;
  border-radius: 4px;
  margin-right: 10px;
}

.name {
  flex: 1;
}

.gap {
  color: #00ff88;
  font-weight: bold;
}
  </style>
</head>
<body>
  <div class="container" id="classement">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Num</th>
        <th>Nom</th>
        <th>Écart</th>
      </tr>
    </thead>
    <tbody></tbody>
  </div>

  <script>
    const url = "/data";

async function fetchData() {
  try {
    const res = await fetch(url);
    const data = await res.json();

    const container = document.getElementById("classement");
    container.innerHTML = "";

    data.forEach(row => {
      const div = document.createElement("div");
      div.className = "row";

      div.innerHTML = `
        <div class="pos">${row.pos}</div>
        <div class="num">${row.num}</div>
        <div class="name">${row.nom}</div>
        <div class="gap">${row.ecart}</div>
      `;

      container.appendChild(div);
    });
  } catch (err) {
    console.error(err);
  }
}

fetchData();
setInterval(fetchData, 20000);

    function autoScroll() {
  const duration = 10000; // durée du scroll (10s)
  const start = window.scrollY;
  const end = document.body.scrollHeight - window.innerHeight;
  const startTime = performance.now();

  function scrollStep(currentTime) {
    const progress = Math.min((currentTime - startTime) / duration, 1);
    const ease = progress * (2 - progress); // easing smooth

    window.scrollTo(0, start + (end - start) * ease);

    if (progress < 1) {
      requestAnimationFrame(scrollStep);
    } else {
      // Une fois en bas → retour direct en haut
      setTimeout(() => {
        window.scrollTo(0, 0);
      }, 1000);
    }
  }

  requestAnimationFrame(scrollStep);
}

// lance toutes les 2 minutes
setInterval(autoScroll, 120000);
  </script>
</body>
</html>
