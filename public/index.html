<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Classement Motocross</title>
  <style>
    table { border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #333; padding: 5px; text-align: center; }
    th { background-color: #eee; }
  </style>
</head>
<body>
  <h1>Classement Motocross</h1>
  <table id="classement">
    <thead>
      <tr>
        <th>Pos</th>
        <th>Num</th>
        <th>Nom</th>
        <th>Écart</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const url = "https://scraper-mx-production.up.railway.app/data"; // Remplace par ton URL Railway

    async function fetchData() {
      try {
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.querySelector("#classement tbody");
        tbody.innerHTML = ""; // vide l’ancien tableau

        data.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.pos}</td>
            <td>${row.num}</td>
            <td>${row.nom}</td>
            <td>${row.ecart}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Erreur fetch :", err);
      }
    }

    // Récupère les données toutes les 20 secondes
    fetchData();                  // première récupération
    setInterval(fetchData, 20000); // ensuite toutes les 20s
  </script>
</body>
</html>
